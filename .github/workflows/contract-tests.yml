name: Contract tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dev dependencies
        run: pip install -e ".[dev]"

      - name: Run contract tests
        run: pytest tests/contract -v
