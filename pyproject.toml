[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "csmp"
version = "0.1.0"
description = "Chapecó Smart Mobility Platform — contract tests and services"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"

[tool.setuptools]
packages = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "jsonschema>=4.21",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.110",
    "openapi-spec-validator>=0.7",
    "confluent-kafka>=2.3",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests", "services/producer/tests", "services/flink-job/tests"]
pythonpath = [".", "services/producer/src", "services/flink-job/src"]
markers = [
    "integration: requires Redpanda at localhost:19092",
    "flink: requires Java + PyFlink",
]
