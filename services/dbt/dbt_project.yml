name: csmp
version: 1.0.0
config-version: 2

profile: csmp

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]

target-path: target
clean-targets:
  - target
  - dbt_packages

vars:
  landing_db_path: "../../data/landing.db"

models:
  csmp:
    staging:
      +materialized: view
    core:
      +materialized: table

seeds:
  csmp:
    chapeco_intersection_locations:
      +column_types:
        intersection_id: string
        display_name: string
        latitude: float64
        longitude: float64
        osm_node_id: int64
        source: string
