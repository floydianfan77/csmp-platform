<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Monitor de Semáforos — Chapecó</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"
  />
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css"
  />
  <link rel="stylesheet" href="/app/styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>Monitor de Semáforos</h1>
      <p class="subtitle">Chapecó · CSMP v0.2</p>
    </div>
    <div id="health-badge" class="health-badge health-unknown" aria-live="polite">
      Carregando…
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-controls">
        <label class="checkbox">
          <input type="checkbox" id="bottleneck-only" />
          Somente gargalos severos
        </label>
        <button type="button" id="refresh-btn" class="btn">Atualizar</button>
      </div>
      <p id="intersection-count" class="count-label">0 cruzamentos</p>
      <ul id="intersection-list" class="intersection-list"></ul>
    </aside>
    <div id="map" class="map" role="application" aria-label="Mapa de cruzamentos"></div>
  </main>

  <footer class="footer">
    Dados via <a href="/docs">Monitor API</a> · atualização automática a cada 30s
  </footer>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script
    src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"
  ></script>
  <script src="/app/app.js" type="module"></script>
</body>
</html>
